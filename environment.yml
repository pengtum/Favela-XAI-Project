# Analysis environment (Python 3.12): the versions with which the analyses were
# run and verified. The per-building indicator table distributed with the paper
# was computed with momepy 0.8 (README, Installation).
# The indicator code uses the momepy functional API with libpysal graphs.
# OpenStreetMap streets are downloaded in a separate environment
# (environment-download.yml) and read here from the cached GeoPackages.
#
#   conda env create -f environment.yml
#   conda activate favela-xai
name: favela-xai
channels:
  - conda-forge
dependencies:
  - python=3.12
  - geopandas=1.1.2
  - shapely=2.1.2
  - pyogrio=0.12.1
  - pyproj=3.7.2
  - momepy=0.11.0
  - libpysal=4.14.1
  - networkx=3.3
  - numpy=2.0.2
  - pandas=3.0.2
  - scipy=1.17.1
  - scikit-learn=1.8.0
  - xgboost=2.1.4                # 2.1.x: the per-site models were fitted with xgboost 2.1.2 (README, Installation)
  - shap=0.49.1
  - matplotlib=3.10.8
  - pyarrow=23.0.1
  - pyyaml=6.0.1
  - rasterio=1.5.0
  - rasterstats=0.20.0
  - contextily=1.7.0
  - pymupdf=1.26.7               # scales ED Fig. 5 and SI Fig. S22 to 183 mm (appendix/S13_boundary_robustness)
  - tqdm=4.66.5
  - pip
  - pip:
      - -e .
